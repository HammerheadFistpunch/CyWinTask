name: Build Windows packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out CyWinTask
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Locate or install Inno Setup 6
        id: inno
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --version=6.5.4 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Inno Setup compiler not found at $compiler."
          }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Build and verify Windows packages
        shell: pwsh
        env:
          INNO_COMPILER: ${{ steps.inno.outputs.compiler }}
        run: |
          [xml]$project = Get-Content CyWinTask.csproj -Raw
          $version = $project.Project.PropertyGroup.Version
          $root = $env:GITHUB_WORKSPACE
          $stage = Join-Path $root 'artifacts/staging'
          $release = Join-Path $root "artifacts/releases/$version"
          New-Item -ItemType Directory -Force $stage, $release | Out-Null

          dotnet publish CyWinTask.csproj -c Release -r win-x64 --self-contained true -o $stage -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'CyWinTask publish failed.' }
          if (-not (Test-Path (Join-Path $stage 'CyWinTask.exe'))) {
            throw 'The published Windows executable is missing.'
          }
          Copy-Item LICENSE (Join-Path $stage 'LICENSE.txt')
          python scripts/check-distribution-privacy.py $stage
          if ($LASTEXITCODE -ne 0) { throw 'Distribution privacy check failed.' }

          $portable = Join-Path $release "CyWinTask-$version-win-x64-portable.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $portable
          python scripts/check-distribution-privacy.py $portable
          if ($LASTEXITCODE -ne 0) { throw 'ZIP privacy check failed.' }

          & $env:INNO_COMPILER "/DAppVersion=$version" "/DPublishDir=$stage" "/DReleaseDir=$release" packaging/CyWinTask.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $installer = Join-Path $release "CyWinTask-$version-win-x64-setup.exe"
          Get-FileHash -LiteralPath $portable, $installer -Algorithm SHA256 | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
          } | Set-Content (Join-Path $release 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload installer, portable ZIP, and checksums
        uses: actions/upload-artifact@v4
        with:
          name: CyWinTask-Windows-x64
          if-no-files-found: error
          path: |
            artifacts/releases/*/*-setup.exe
            artifacts/releases/*/*-portable.zip
            artifacts/releases/*/SHA256SUMS.txt
